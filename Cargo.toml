[package]
name = "gum-core"
version = "0.1.0"
edition = "2021"
description = "Canonical parser, AST, validator, and formatter for the Gum markup language"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = "7.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []
wasm = []
